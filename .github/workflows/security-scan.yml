name: 🔒 Security scan

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: 🔍 Secret scanning
    runs-on: ubuntu-latest
    # gitleaks-action is free for personal-account repos (confirmed via
    # its own docs) -- this repo qualifies. Worth knowing: it's an
    # EULA-licensed, closed-source action from a commercial company
    # (Gitleaks LLC), not a community open-source tool -- the license
    # terms only permit free use for personal accounts, not
    # organizations. If this repo ever transfers to an org, a
    # GITLEAKS_LICENSE secret would become required.
    permissions:
      contents: read
      pull-requests: write # required for gitleaks-action's PR-comment feature
    steps:
      - name: ➡️ Checkout (full history for scanning)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔍 Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  regression-check:
    name: 🔒 Hand-fixed security regression check
    runs-on: ubuntu-latest
    steps:
      - name: ➡️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔒 Re-assert previously-fixed security issues remain fixed
        run: bash scripts/check-security-regressions.sh
