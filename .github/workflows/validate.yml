name: ✅ Validate

# Runs on every push and PR -- the core gate this repo did not have
# before this workflow was added. Nothing previously ran on push/PR at
# all; the only existing workflow (sync-plugins.yml) is schedule-only.
on:
  push:
    branches: [master]
  pull_request:

# Least-privilege by default. No job here needs to write anything.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid force-pushes to a PR
# branch) instead of letting them pile up.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-smoke-test:
    name: 🚀 Startup smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: ➡️ Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: 🐧 Install Vim (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y vim

      - name: 🍎 Install Vim (macOS)
        if: runner.os == 'macOS'
        run: brew install vim

      - name: 🚀 Run startup smoke test
        run: bash scripts/startup-smoke-test.sh

      - name: 📂 Run per-filetype open test
        run: bash scripts/ftplugin-open-test.sh

  gitmodules-consistency:
    name: 🔗 .gitmodules ↔ pack/ consistency
    runs-on: ubuntu-latest
    steps:
      - name: ➡️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔗 Check consistency
        run: bash scripts/check-gitmodules-consistency.sh

  ftplugin-hygiene:
    name: 🧹 ftplugin buffer-scoping & setl hygiene
    runs-on: ubuntu-latest
    steps:
      - name: ➡️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🧹 Check ftplugin hygiene
        run: bash scripts/check-ftplugin-hygiene.sh

  vimscript-lint:
    name: 📜 Vimscript lint (vint)
    runs-on: ubuntu-latest
    steps:
      - name: ➡️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐍 Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: 📦 Install vint
        run: pip install vim-vint

      - name: 📜 Run vint
        run: bash scripts/run-vint.sh
