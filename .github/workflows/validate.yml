name: ✅ Validate

# Runs on every push and PR -- the core gate this repo did not have
# before this workflow was added. Nothing previously ran on push/PR at
# all; the only existing workflow (sync-plugins.yml) is schedule-only.
on:
  push:
    branches: [master]
  pull_request:

# Least-privilege by default. No job here needs to write anything.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid force-pushes to a PR
# branch) instead of letting them pile up.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-smoke-test:
    name: 🚀 Startup smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: ➡️ Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: 🐧 Install Vim (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y vim

      - name: 🍎 Install Vim (macOS)
        if: runner.os == 'macOS'
        run: brew install vim

      - name: 🚀 Run startup smoke test
        run: bash scripts/startup-smoke-test.sh

      - name: 📂 Run per-filetype open test
        run: bash scripts/ftplugin-open-test.sh

  gitmodules-consistency:
    name: 🔗 .gitmodules ↔ pack/ consistency
    runs-on: ubuntu-latest
    steps:
      - name: ➡️ Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 🔗 Check consistency
        run: bash scripts/check-gitmodules-consistency.sh

  ftplugin-hygiene:
    name: 🧹 ftplugin buffer-scoping & setl hygiene
    runs-on: ubuntu-latest
    steps:
      - name: ➡️ Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 🧹 Check ftplugin hygiene
        run: bash scripts/check-ftplugin-hygiene.sh

  vimscript-lint:
    name: 📜 Vimscript lint (vint)
    runs-on: ubuntu-latest
    steps:
      - name: ➡️ Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 🐍 Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Pinned rather than '3.x' -- not because vint is Python-version-
          # sensitive (it isn't; see the setuptools note below), but because
          # a floating selector previously resolved to whatever the newest
          # available interpreter was on a given day, which is its own
          # source of un-reproducible CI failures independent of this one.
          python-version: '3.12'

      - name: 📦 Install vint
        # vim-vint (last released version 0.3.21) imports the deprecated
        # `pkg_resources` module, with no apparent upstream fix for its
        # removal. Newer setuptools versions (81+) dropped pkg_resources
        # entirely, which broke this job outright with
        # "ModuleNotFoundError: No module named 'pkg_resources'" --
        # reproduced locally in a clean venv before this fix, confirmed
        # fixed with a real lint run, not just `vint --help`. Note the pin
        # is explicitly time-bounded: pkg_resources itself is slated for
        # full removal from Python packaging as early as 2025-11-30 per
        # setuptools' own deprecation warning, at which point this pin
        # stops being a workaround and vint stops being usable at all
        # unless its upstream fixes this first. If this step starts
        # failing again with a pkg_resources-related error, that's most
        # likely why -- check whether a vim-vint release newer than 0.3.21
        # exists and has addressed it before assuming this pin needs
        # adjusting further.
        run: |
          pip install "setuptools<81"
          pip install vim-vint

      - name: 📜 Run vint
        run: bash scripts/run-vint.sh
